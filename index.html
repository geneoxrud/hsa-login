<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Services Library sign-in</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#5b6475; --accent:#1f6feb; --border:#d9dee7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1218; --card:#171b23; --text:#e6e9ef; --muted:#9aa3b2; --accent:#4c8dff; --border:#2a3140; } }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:420px; margin:12vh auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; }
  h1 { font-size:1.25rem; margin:0 0 8px; } p { color:var(--muted); line-height:1.5; }
</style>
</head>
<body>
<main><div class="card">
  <h1>Home Services Library</h1>
  <p>This page only handles sign-in for a private Claude connector. There is nothing to see here
  directly; Claude opens the sign-in page automatically when you connect.</p>
</div></main>
</body>
</html>
